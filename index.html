<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BIO Mirov</title>
  <meta name="description" content="BIO Mirov — links, music and Telegram.">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: #eaeaea;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
      position: relative;
    }

    /* OLD INTERNET NOISE */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: 0.045;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    /* CRT SCANLINES */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 19;
      opacity: 0.08;

      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,0.08) 3px
      );
    }

    /* BACKGROUND */
    .scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background:
        radial-gradient(
          circle at 70% 25%,
          rgba(255,255,255,0.035),
          transparent 30%
        ),
        radial-gradient(
          circle at 20% 75%,
          rgba(255,255,255,0.025),
          transparent 35%
        );
    }

    /* MAIN */
    main {
      width: min(560px, 88vw);
      margin-left: clamp(6vw, 13vw, 15vw);
      padding: 14vh 0 7vh;

      animation: flicker 7s infinite;
    }

    @keyframes flicker {
      0%, 96%, 100% {
        opacity: 1;
      }

      97% {
        opacity: 0.92;
      }

      98% {
        opacity: 0.97;
      }
    }

    /* HEADER */
    .top {
      margin-bottom: 55px;
    }

    h1 {
      margin: 0 0 15px;

      font-size: clamp(42px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.95;
    }

    .quote {
      margin: 0;
      max-width: 500px;

      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    /* LINKS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .link {
      position: relative;
      display: inline-block;
      width: fit-content;

      color: #eee;
      text-decoration: none;

      font-size: 16px;
      letter-spacing: 1px;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .link::before {
      content: "→";

      position: absolute;
      left: -25px;

      opacity: 0;

      transition: opacity 0.2s ease;
    }

    .link:hover {
      transform: translateX(7px);
      opacity: 0.65;
    }

    .link:hover::before {
      opacity: 1;
    }

    /* STATUS */
    .status {
      margin-top: 40px;

      color: #555;

      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* FOOTER */
    .footer {
      margin-top: 80px;

      color: #444;

      font-family: monospace;
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* VISITOR COUNTER — AT THE VERY END */
    .visitors {
      margin-top: 35px;
      padding-top: 20px;

      border-top: 1px solid #181818;

      color: #555;

      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .visitors span {
      color: #aaa;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      main {
        width: 84vw;
        margin-left: 8vw;
        padding-top: 12vh;
      }

      .top {
        margin-bottom: 45px;
      }

      .links {
        gap: 20px;
      }

      .link {
        font-size: 15px;
      }

      .footer {
        margin-top: 65px;
      }
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 40px;
      }

      .quote {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }

      .link {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="scene"></div>

  <main>

    <!-- HEADER -->
    <section class="top">

      <h1>BIO Mirov</h1>

      <p class="quote">
        Not everything that happens around deserves a reaction.
      </p>

    </section>


    <!-- LINKS -->
    <nav class="links">

      <a
        class="link"
        href="https://t.me/Mirov019"
        target="_blank"
        rel="noopener noreferrer"
      >
        TELEGRAM ↗
      </a>

      <a
        class="link"
        href="https://on.soundcloud.com/zfqaTsgxlqWw79hfg9"
        target="_blank"
        rel="noopener noreferrer"
      >
        MUSIC ↗
      </a>

      <a
        class="link"
        href="https://instagram.com/Mirov019"
        target="_blank"
        rel="noopener noreferrer"
      >
        INSTAGRAM ↗
      </a>

    </nav>


    <!-- STATUS -->
    <div class="status">
      MIROV // ONLINE
    </div>


    <!-- FOOTER -->
    <footer class="footer">
      JUST IMPROVE.<br>
      © 2026 MIROV
    </footer>


    <!-- VISITORS — LAST ELEMENT -->
    <div class="visitors">
      VISITORS: <span id="visitor-count">...</span>
    </div>

  </main>


  <!-- GOATCOUNTER — YOUR PRIVATE STATISTICS -->
  <script
    data-goatcounter="https://mirov019.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>


  <!-- PUBLIC VISITOR COUNTER -->
  <script
    src="https://counterapi.com/c.js?ns=khotmirov.github.io"
    async>
  </script>

  <script>
    fetch(
      "https://counterapi.com/api/khotmirov.github.io/view/visitors"
    )
      .then(response => response.json())
      .then(data => {
        if (data && data.value !== undefined) {
          document.getElementById("visitor-count").textContent =
            Number(data.value).toLocaleString("en-US");
        } else {
          document.getElementById("visitor-count").textContent = "—";
        }
      })
      .catch(() => {
        document.getElementById("visitor-count").textContent = "—";
      });
  </script>

</body>
</html>
